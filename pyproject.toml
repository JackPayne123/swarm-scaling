[project]
name = "swarm-scaling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Payne", email = "66894878+JackPayne123@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "google-genai>=2.28.0",
    "inspect-ai>=0.3.276",
    "inspect-harbor>=1.0.0",
    "litellm>=1.83",
    "openai>=3.1",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scipy>=1.18.1",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
